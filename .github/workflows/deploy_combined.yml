name: Deploy Combined to GitHub Pages

on:
    workflow_run:
      workflows: ["Publish Docs"]
      types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas necesarias  
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq


      - name: Autenticar GitHub CLI  
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Descargar artefactos de DocFx
        uses: actions/download-artifact@v4
        with:
          name: docfx-docs
          github-token: ${{ secrets.GH_TOKEN }}
          repository: ${{ github.repository }}
          path: temp/docfx

      - name: Descargar artefactos de Semgrep
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: temp/semgrep

      - name: Unificar contenido para GitHub Pages
        run: |
          mkdir -p public/docs
          mkdir -p public/semgrep
          cp -r temp/docfx/* public/docs/
          cp -r temp/semgrep/* public/semgrep/

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
