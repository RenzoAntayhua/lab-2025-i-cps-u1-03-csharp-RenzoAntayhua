name: Deploy Combined to GitHub Pages

on:
    workflow_run:
      workflows: ["Publish Docs"]
      types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas necesarias  
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Descargar artefactos de DocFx
        uses: actions/download-artifact@v4
        with:
          name: docfx-docs
          path: temp/docfx
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Descargar semgrep-report via gh
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            # 1) Find the most recent successful Semgrep Analysis run on main
            run_id=$(gh run list \
              --workflow "Semgrep Analysis" \
              --branch main \
              --limit 5 \
              --json databaseId,conclusion \
              --jq '.[] | select(.conclusion=="success") | .databaseId' \
              | head -n1)
        
            if [ -z "$run_id" ]; then
              echo "No successful Semgrep Analysis run found" >&2
              exit 1
            fi
        
            echo "Downloading semgrep-report from run $run_id"
            # 2) Download the named artifact
            gh run download "$run_id" \
              --name semgrep-report \
              --dir temp/semgrep
        

      - name: Unificar contenido para GitHub Pages
        run: |
          mkdir -p public/docs
          mkdir -p public/semgrep
          cp -r temp/docfx/* public/docs/
          cp -r temp/semgrep/* public/semgrep/

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
